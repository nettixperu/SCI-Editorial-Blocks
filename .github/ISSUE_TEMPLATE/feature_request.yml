name: Feature request
description: Suggest an editorial or Gutenberg-native improvement.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: checkboxes
    id: acknowledgement
    attributes:
      label: Acknowledgement
      options:
        - label: I searched existing issues for this idea.
          required: true
  - type: textarea
    id: use-case
    attributes:
      label: Problem / use case
      description: What problem are you trying to solve?
    validations:
      required: true
  - type: textarea
    id: proposed-behavior
    attributes:
      label: Proposed behavior
      description: Describe how you expect the improvement to work.
    validations:
      required: true
  - type: textarea
    id: fit
    attributes:
      label: Why this belongs in SCI Editorial Blocks
    validations:
      required: true
  - type: textarea
    id: core-reuse
    attributes:
      label: Gutenberg / Core reuse
      description: Does WordPress or Gutenberg already provide something related?
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: textarea
    id: context
    attributes:
      label: Additional context
  - type: markdown
    attributes:
      value: >-
        Features should remain aligned with Gutenberg-native and WordPress-native
        design, minimal runtime dependencies, content portability, and no speculative architecture.
